name: Release Library

on:
  push:
    tags:
      - 'v*' # Trigger on tag push matching v*, e.g., v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Library
        run: npm run build:lib

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/longtable/oatear-longtable-*.tgz
          generate_release_notes: true
